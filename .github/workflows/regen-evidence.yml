name: Regenerate spell evidence (one-time)
on:
  push:
    branches: [improve/spell-evidence-contract-20260925]
    paths:
      - .github/workflows/regen-evidence.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Regenerate from canonical README
        run: python3 scripts/build.py
      - name: Commit generated catalogue and 150 evidence pages
        shell: bash
        run: |
          set -euo pipefail
          git add public/spells.json public/spells
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: regenerate spell verification metadata"
          git push origin HEAD:improve/spell-evidence-contract-20260925
