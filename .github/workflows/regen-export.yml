name: Regenerate standalone exports (one-time)
on:
  push:
    branches: [improve/standalone-spell-export-20260925]
    paths: [.github/workflows/regen-export.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Build deterministic downloads from README
        run: python3 scripts/build.py
      - name: Commit generated docs and downloads
        shell: bash
        run: |
          set -euo pipefail
          git add public/spells public/download
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: generate standalone downloadable HTML"
          git push origin HEAD:improve/standalone-spell-export-20260925
