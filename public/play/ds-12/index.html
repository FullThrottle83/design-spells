<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex,follow">
  <title>Demo: Scroll Snap gallery — Design Spells</title>
  <style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    color-scheme: light dark;
    --color-primary: light-dark(oklch(0.18 0.01 260), oklch(0.96 0.002 90));
    --color-bg: light-dark(oklch(0.985 0.002 90), oklch(0.14 0.005 260));
    --color-text: light-dark(oklch(0.18 0.01 260), oklch(0.96 0.002 90));
    --color-text-muted: light-dark(oklch(0.545 0.012 260), oklch(0.62 0.008 90));
    --color-text-inverse: light-dark(oklch(0.99 0.002 90), oklch(0.14 0.005 260));
    --color-border: light-dark(oklch(0.92 0.005 90), oklch(0.24 0.008 260));
    --color-surface: light-dark(oklch(0.995 0.001 90), oklch(0.18 0.006 260));
    --color-surface-offset: light-dark(oklch(0.963 0.004 90), oklch(0.16 0.005 260));
    --color-surface-dynamic: light-dark(oklch(0.92 0.005 90), oklch(0.3 0.01 260));
    --color-surface-dark: light-dark(oklch(0.18 0.01 260), oklch(0.1 0.004 260));
    --color-error: oklch(0.52 0.17 27);
    --color-success: oklch(0.5 0.12 155);
    --color-accent: light-dark(oklch(0.62 0.22 38), oklch(0.68 0.19 38));
    --radius-sm: 2px;
    --radius-md: 2px;
    --radius-lg: 4px;
    --space-1: .25rem;
    --space-2: .5rem;
    --space-3: .75rem;
    --space-4: 1rem;
    --space-5: 1.25rem;
    --space-6: 1.5rem;
    --space-8: 2rem;
    --header-height: 3rem;
  }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background-color: var(--color-bg);
    color: var(--color-text);
    font: 13px/1.5 var(--ds-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif);
  }
  body {
    padding: 16px;
    display: grid;
    place-items: center;
  }
  img { max-width: 100%; height: auto; display: block; }
  button, .btn, a.btn { min-block-size: 36px; font: inherit; color: inherit; }
  :where(button), .btn, .btn-primary {
    padding: 0 .9rem;
    border: 1px solid var(--color-border);
    background: var(--color-surface);
    cursor: pointer;
    border-radius: var(--radius-md);
  }
  .btn-primary {
    background: var(--color-primary);
    color: var(--color-text-inverse);
    border-color: transparent;
  }
  :where(input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]):not([type="color"]):not([type="hidden"])),
  :where(select),
  :where(textarea) {
    font: inherit;
    color: inherit;
    padding: .45rem .65rem;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    background: var(--color-surface);
  }
  :where(select) { padding-inline-end: 1.6rem; }
  :where(textarea) { resize: vertical; min-block-size: 5rem; }
  :where(input, select, textarea):focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 1px;
  }
  :where(input[type="checkbox"], input[type="radio"]) {
    inline-size: 16px;
    block-size: 16px;
  }
  :where(a) { color: var(--color-accent); text-underline-offset: 2px; }
  :where(table) { border-collapse: collapse; inline-size: 100%; font-variant-numeric: tabular-nums; }
  :where(th, td) { padding: .4rem .6rem; border-bottom: 1px solid var(--color-border); text-align: left; }
  :where(ul, ol) { padding-inline-start: 1.2rem; margin: 0; }
  .sr-only {
    position: absolute;
    inline-size: 1px; block-size: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }
  .demo-note {
    margin: 0;
    max-inline-size: 36ch;
    text-align: center;
    color: var(--color-text-muted);
    font-size: 12px;
  }


    *,*::before,*::after {box-sizing:border-box}
    html {scroll-behavior:smooth}
    body {display:block; min-height:100dvh; padding:0}
    .stage {position:relative;display:grid;place-items:center;min-height:280px;padding:2rem;width:100%;isolation:isolate}
    .stage > * {max-width:100%}
    .stage:has(details) {align-items:start}
    .demo-hint {padding:.7rem 1rem;color:var(--color-text-muted);font-size:.875rem}
    .scroll-content {min-height:110vh;display:grid;place-items:center;align-content:center;padding:2rem}
    .page-transition {padding:clamp(2rem,7vw,6rem);max-width:60rem;margin:auto}
    .page-transition a {display:inline-block;margin-top:2rem}
    .print-example {max-width:42rem;margin:3rem auto;line-height:1.7;padding:1rem}
    @media (prefers-reduced-motion:reduce) {html {scroll-behavior:auto}}
    
.gallery {
  display: flex;
  overflow-x: auto;
  gap: var(--space-4);
  scroll-snap-type: x mandatory;
  overscroll-behavior-x: contain;
}
.gallery > * {
  flex: 0 0 clamp(280px, 70vw, 480px);
  scroll-snap-align: start;
}

/* Demo-only art direction; the spell rules above remain authoritative. */
.stage:has(.showcase) {padding:clamp(18px,4vw,56px);min-height:min(100dvh,760px);align-content:center}
.showcase {min-width:0;width:min(100%,920px);font-size:16px;line-height:1.6;--color-primary:light-dark(#254f4b,#9ed5c4)}
.showcase h1 {font-family:Georgia,serif;font-weight:400;letter-spacing:-.045em;font-size:clamp(32px,4.5vw,58px);line-height:1.08;margin:14px 0 20px;text-wrap:balance}
.showcase h2 {line-height:1.2;letter-spacing:-.025em}
.showcase p {margin:0 0 20px}
.showcase .scene-kicker {font:600 11px/1.5 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;margin:0}
.showcase a {color:inherit}
.showcase :where(a,input,summary,[tabindex="0"]):focus-visible {outline:2px solid var(--color-primary);outline-offset:5px}
.showcase svg {display:block;width:100%;height:auto}
.showcase .scene-instruction {border-top:1px solid var(--color-border);padding-top:18px;margin:24px 0 0;font-size:13px;max-width:70ch}
.showcase small {font-size:12px}

.print-gallery {min-width:0;width:100%}.print-gallery header {margin-bottom:30px}
.print-gallery .gallery {width:100%;padding-bottom:14px;scrollbar-width:thin}
.print-gallery figure {margin:0;min-width:0;background:var(--color-surface);border:1px solid var(--color-border)}
.print-gallery figcaption {display:grid;gap:4px;padding:18px}.print-gallery figcaption span {font-family:Georgia,serif;font-size:24px}
.print-gallery figcaption small {color:var(--color-text-muted)}
.print-gallery .gallery-foot {display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:12px;margin-top:16px}
</style>
</head>
<body>
  <div class="stage"><div class="showcase"><div class="print-gallery"><header><p class="scene-kicker">The print room / Collection 03</p><h1>Studies in stillness.</h1><p>Three architectural compositions. One continuous shelf.</p></header><div class="gallery" tabindex="0" role="region" aria-label="Three art prints"><figure><svg class="study-art" viewBox="0 0 640 440" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><rect width="640" height="440" fill="#dfd4bf"/><circle cx="420" cy="128" r="65" fill="#c15b3c"/><path d="M110 440V225a145 145 0 0 1 290 0v215Z" fill="#303c35"/><path d="M185 440V225a70 70 0 0 1 140 0v215Z" fill="#b0b39b"/><path d="M0 375h640v65H0Z" fill="#303c35"/></svg><figcaption><span>01 / Archway</span><small>Terracotta & stone</small></figcaption></figure><figure><svg class="study-art" viewBox="0 0 640 440" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><rect width="640" height="440" fill="#d7e2dd"/><path d="M0 350 180 85 360 350Z" fill="#254f4b"/><path d="m230 350 170-225 220 225Z" fill="#71988a"/><circle cx="500" cy="96" r="42" fill="#e6b66c"/><path d="M0 380h640" stroke="#254f4b" stroke-width="16"/></svg><figcaption><span>02 / Highlands</span><small>Pine & morning mist</small></figcaption></figure><figure><svg class="study-art" viewBox="0 0 640 440" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><rect width="640" height="440" fill="#e8c6b0"/><path d="M0 280Q160 120 320 280T640 280V440H0Z" fill="#ae503b"/><path d="M0 370Q160 210 320 370T640 370V440H0Z" fill="#592f2d"/><circle cx="320" cy="115" r="64" fill="#f7e7cd"/></svg><figcaption><span>03 / Tidal forms</span><small>Clay & evening light</small></figcaption></figure></div><p class="gallery-foot">← Scroll to explore → <span>Original vector studies · 2026</span></p></div><p class="scene-instruction">Swipe or scroll sideways. Keyboard: Tab into the gallery, then use the arrow keys. Each print snaps into place.</p></div></div>

</body>
</html>
