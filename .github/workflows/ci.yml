name: Verify catalogue

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: git diff --exit-code -- public/index.html public/spells.json public/spells public/play public/sitemap.xml
      - run: test -z "$(git status --porcelain -- public/spells public/play public/sitemap.xml)"
      - run: node --check public/search.js
      - run: npm test
      - run: git diff --check
