name: Bootstrap generated lean catalogue
on:
  push:
    branches:
      - improve/lean-catalog-20260925
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Rebuild tracked static assets
        run: |
          python3 scripts/build.py
          git add public/index.html public/classic/index.html public/spells.json public/spells public/play public/sitemap.xml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: refresh generated catalogue pages"
            git push origin HEAD:improve/lean-catalog-20260925
          fi
