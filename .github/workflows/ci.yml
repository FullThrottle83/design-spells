name: Synchronize generated catalogue

on:
  push:
    branches:
      - improve/static-spell-pages-20260925

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/spells.json public/spells public/play public/sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "build: synchronize direct catalogue links"
            git push
          fi
