name: Verify catalogue

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: test -s public/classic/index.html
      - run: git diff --exit-code -- public/index.html public/spells.json public/spells public/play public/download public/sitemap.xml
      - run: test -z "$(git status --porcelain -- public/spells public/play public/download public/sitemap.xml)"
      - run: node --check public/search.js
      - run: npm test
      - run: git diff --check

  cross-browser:
    name: Firefox and WebKit smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run build
      - run: npx playwright test -c playwright.cross-browser.config.mjs

  deploy:
    name: Deploy static assets to Cloudflare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, cross-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: test -s public/classic/index.html
      - name: Check Cloudflare deployment credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets or the account ID as a repository variable."
            exit 1
          fi
      - name: Deploy prebuilt, verified assets
        run: npx --yes wrangler@4 deploy --config wrangler.json
      - name: Smoke-test published pages
        shell: bash
        run: |
          set -euo pipefail
          origin="https://design-spells.hultsan20.workers.dev"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 3 "$origin/spells/ds-1/" -o "$RUNNER_TEMP/ds-doc.html"
          grep -Fq "Isolated demonstration" "$RUNNER_TEMP/ds-doc.html"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 3 "$origin/play/ds-14/next/" -o "$RUNNER_TEMP/ds-next.html"
          grep -Fq "Return to page A" "$RUNNER_TEMP/ds-next.html"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 3 "$origin/classic/" -o "$RUNNER_TEMP/ds-classic.html"
          grep -Fq "classic" "$RUNNER_TEMP/ds-classic.html"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 3 "$origin/play/ds-120/" -o "$RUNNER_TEMP/ds-120.html"
          grep -Fq ".filter-matrix-wrap:has(#f-tech:not(:checked))" "$RUNNER_TEMP/ds-120.html"
          echo "Cloudflare assets are live at $origin"
